# ============================================================
#  CI/CD pipeline: Test -> Build & Push image -> Deploy to K8s
#  Runs automatically on GitHub every time you push code.
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]        # full pipeline on main
  pull_request:
    branches: [main]        # only CI (tests + build) on pull requests

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-starter

jobs:
  # ---------------- CI STAGE 1: TEST ----------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v                 # if any test fails, the pipeline stops here

  # ------------- CI STAGE 2: BUILD & PUSH ------------
  build:
    needs: test                         # only runs if tests passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                   # allows pushing to GitHub Container Registry
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"   # short commit id = image tag

      - name: Build image
        run: docker build -t $IMAGE:${{ steps.vars.outputs.tag }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "0"                # set to "1" to fail the pipeline on findings

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: docker push $IMAGE:${{ steps.vars.outputs.tag }}

  # ---------------- CD: DEPLOY ----------------
  # Deploys to a throwaway Kubernetes cluster (kind) inside the runner,
  # so you can practise real deployments for free, with no Azure account.
  deploy:
    needs: build
    if: github.event_name == 'push'     # never deploy from a pull request
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1

      - name: Pull image from registry and load into cluster
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE:$TAG
          kind load docker-image $IMAGE:$TAG --name chart-testing

      - name: Deploy
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE:$TAG|; s|VERSION_PLACEHOLDER|$TAG|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/cicd-starter --timeout=120s

      - name: Smoke test the live deployment
        run: |
          kubectl port-forward svc/cicd-starter 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/
          kubectl get pods -o wide

  # ---------------- OPTIONAL: DEPLOY TO REAL AKS ----------------
